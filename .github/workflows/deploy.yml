name: Build and Verify Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Linting
        run: npm run lint

      - name: Verify Type Checking & Build
        run: npm run build

      - name: Static Verification
        run: ls -la .next
